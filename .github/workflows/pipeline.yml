name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check HTML
        run: npx --yes htmlhint@1.6.3 index.html

      - name: Build Docker image
        run: docker build -t lab-test .

      - name: Smoke test container
        run: |
          docker run -d --name test -p 8080:80 lab-test
          sleep 3
          curl -fsS http://localhost:8080 > page.html
          grep -q "algazinajuv-ops" page.html
          echo "OK"

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/algazinajuv-ops/algazinajuv-ops-ci-cd-lab:latest

